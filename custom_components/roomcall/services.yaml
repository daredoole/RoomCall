broadcast:
  fields:
    areas:
      example: ["kitchen", "living_room"]
      selector:
        area:
          multiple: true
    people:
      example: ["person.alex"]
      selector:
        entity:
          domain: person
          multiple: true
    speakers:
      example: ["media_player.kitchen"]
      selector:
        entity:
          domain: media_player
          multiple: true
    message:
      example: "Dinner is ready"
      selector:
        text:
          multiline: true
    media_url:
      example: "http://homeassistant.local:8123/local/chime.mp3"
      selector:
        text:
    volume:
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider
    priority:
      default: normal
      selector:
        select:
          options:
            - normal
            - urgent

communicate:
  fields:
    operation:
      required: true
      default: discover
      selector:
        select:
          translation_key: communication_operation
          options:
            - discover
            - diagnose
            - preview
            - send
            - ask
            - status
            - cancel
            - acknowledge
            - sound_test
            - confirm_test
            - adapter
            - voicemail
    request:
      default: {}
      selector:
        object:
