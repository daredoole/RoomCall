blueprint:
  name: RoomCall – Announce arrivals
  description: Say who just got home in the rooms you choose.
  domain: automation
  source_url: https://github.com/daredoole/RoomCall/blob/main/blueprints/automation/roomcall/arrival.yaml
  author: daredoole
  homeassistant:
    min_version: "2025.6.0"
  input:
    people:
      name: People
      selector:
        entity:
          multiple: true
          filter:
            - domain: person
    rooms:
      name: Rooms
      default: []
      selector:
        area:
          multiple: true
    message:
      name: Message
      description: "{name} is replaced with the person's name."
      default: "{name} is home."
      selector:
        text:

mode: queued

triggers:
  - trigger: state
    entity_id: !input people
    to: home

conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'home' }}"

actions:
  - action: roomcall.broadcast
    data:
      areas: !input rooms
      message: "{{ message_template | replace('{name}', trigger.to_state.name) }}"

variables:
  message_template: !input message
