blueprint:
  name: RoomCall – Appliance finished
  description: >-
    Announce when a washer, dryer or dishwasher finishes, using its power sensor: it is
    "running" above a threshold and "done" once power stays below it for a while.
  domain: automation
  source_url: https://github.com/daredoole/RoomCall/blob/main/blueprints/automation/roomcall/appliance_done.yaml
  author: daredoole
  homeassistant:
    min_version: "2025.6.0"
  input:
    power_sensor:
      name: Power sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: power
    threshold:
      name: Running above
      default: 10
      selector:
        number:
          min: 1
          max: 500
          unit_of_measurement: W
    settle:
      name: Done after below threshold for
      default:
        minutes: 3
      selector:
        duration:
    rooms:
      name: Rooms
      default: []
      selector:
        area:
          multiple: true
    message:
      name: Message
      default: The laundry is done.
      selector:
        text:

mode: single

triggers:
  - trigger: numeric_state
    entity_id: !input power_sensor
    below: !input threshold
    for: !input settle

conditions:
  # Only when it was actually running before going quiet.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state | float(0) >= threshold }}

actions:
  - action: roomcall.broadcast
    data:
      areas: !input rooms
      message: !input message

variables:
  threshold: !input threshold
