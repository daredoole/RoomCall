name: iOS
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check native translation catalogs
        run: python3 scripts/ios_localizations.py --check
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/RoomCall/project.yml
          xcodebuild -version
      - name: Select and boot available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          iphone = next(device for runtime, group in devices['devices'].items() if 'iOS' in runtime
                        for device in group if device['name'].startswith('iPhone'))
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('ROOMCALL_SIMULATOR=' + iphone['udid'] + '\n')
          if iphone['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', iphone['udid']], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', iphone['udid'], '-b'], check=True)
          # A clean, consistent status bar for documentation screenshots.
          subprocess.run(['xcrun', 'simctl', 'status_bar', iphone['udid'], 'override', '--time', '9:41',
                          '--batteryState', 'charged', '--batteryLevel', '100',
                          '--cellularBars', '4', '--wifiBars', '3'], check=True)
          PY
      - name: Build native app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/RoomCall/RoomCall.xcodeproj -scheme RoomCall \
            -destination "platform=iOS Simulator,id=$ROOMCALL_SIMULATOR" \
            -derivedDataPath /tmp/roomcall-ios-build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES | tee /tmp/roomcall-ios-build.log
      - name: Warm up the app on the simulator
        run: |
          # The first launch of a fresh install can exceed XCUITest's launch timeout.
          app=/tmp/roomcall-ios-build/Build/Products/Debug-iphonesimulator/RoomCall.app
          xcrun simctl install "$ROOMCALL_SIMULATOR" "$app"
          xcrun simctl launch "$ROOMCALL_SIMULATOR" com.daredoole.RoomCall
          sleep 10
          xcrun simctl terminate "$ROOMCALL_SIMULATOR" com.daredoole.RoomCall
      - name: Test native app and controls
        run: |
          set -o pipefail
          xcodebuild test-without-building -project ios/RoomCall/RoomCall.xcodeproj -scheme RoomCall \
            -destination "platform=iOS Simulator,id=$ROOMCALL_SIMULATOR" \
            -derivedDataPath /tmp/roomcall-ios-build -resultBundlePath /tmp/RoomCall.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES | tee -a /tmp/roomcall-ios-build.log
      - name: Export documentation screenshots
        if: always()
        run: |
          mkdir -p /tmp/ios-screenshots
          xcrun xcresulttool export attachments --path /tmp/RoomCall.xcresult --output-path /tmp/ios-screenshots
          ls -la /tmp/ios-screenshots
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent /tmp/roomcall-ios-build/Build/Products/Debug-iphonesimulator/RoomCall.app /tmp/RoomCall-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: roomcall-ios-simulator
          path: |
            /tmp/RoomCall.xcresult
            /tmp/roomcall-ios-build.log
            /tmp/RoomCall-simulator.zip
            /tmp/ios-screenshots
