name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/ios_localizations.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Set up pinned ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        timeout-minutes: 5
        with:
          ffmpeg-version: "7.0.2"
      - run: ffmpeg -version
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pytest -q --cov=src/roomcall --cov-fail-under=100

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
      - name: Set up pinned ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        timeout-minutes: 5
        with:
          ffmpeg-version: "7.0.2"
      - run: ffmpeg -version
      - run: uv venv && uv pip install "pytest-homeassistant-custom-component==0.13.316" ha-ffmpeg "HAP-python==5.0.0" pytest-cov
      - run: uv run python scripts/install_ha_test_deps.py
      - name: Home Assistant tests with 100% statement coverage
        run: |
          uv run pytest tests_ha -q -p no:cacheprovider \
            --cov=custom_components/roomcall --cov-report=term --cov-report=markdown:coverage.md \
            --cov-fail-under=100 --junitxml=ha-results.xml -o junit_family=xunit1
      - name: Coverage summary
        if: always()
        run: test -f coverage.md && cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Protocol-agent acceptance summary
        if: always() && hashFiles('ha-results.xml') != ''
        run: uv run python scripts/agent_benchmark_report.py ha-results.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ha-supported-acceptance
          path: ha-results.xml

  home-assistant-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
      - name: Set up pinned ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        timeout-minutes: 5
        with:
          ffmpeg-version: "7.0.2"
      - run: ffmpeg -version
      - run: uv venv && uv pip install "pytest-homeassistant-custom-component==0.13.373" ha-ffmpeg "HAP-python==5.0.0" pytest-cov
      - run: uv run python scripts/install_ha_test_deps.py
      - run: uv run pytest tests_ha -q --cov=custom_components/roomcall --cov-fail-under=100 --junitxml=ha-results.xml -o junit_family=xunit1
      - name: Protocol-agent acceptance summary
        if: always() && hashFiles('ha-results.xml') != ''
        run: uv run python scripts/agent_benchmark_report.py ha-results.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ha-current-acceptance
          path: ha-results.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv venv && uv pip install playwright
      - name: Install Chromium
        timeout-minutes: 5
        run: uv run playwright install chromium
      - name: Ensure Chromium runtime dependencies
        timeout-minutes: 5
        run: |
          if ! uv run python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()"; then
            uv run playwright install-deps chromium
          fi
      - run: uv run python scripts/qa_communication.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv venv && uv pip install -e ".[docs]"
      - run: uv run python scripts/doc_assets.py
      - run: uv run mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
