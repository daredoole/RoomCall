name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check versions match the tag
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          versions = {
              "manifest": json.loads(Path("custom_components/roomcall/manifest.json").read_text())["version"],
              "package": tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"],
          }
          for name, file, constant in (
              ("integration", "custom_components/roomcall/const.py", "VERSION"),
              ("standalone", "src/roomcall/__init__.py", "__version__"),
              ("card", "custom_components/roomcall/frontend/roomcall-card.js", "const CARD_VERSION"),
          ):
              versions[name] = re.search(rf'^{constant} = "([^"]+)"', Path(file).read_text(), re.M)[1]
          print(f"tag={tag}, versions={versions}")
          assert all(version == tag for version in versions.values()), "Version mismatch"
          PY
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - name: Zip the Home Assistant integration for HACS
        run: cd custom_components/roomcall && zip -r "$GITHUB_WORKSPACE/dist/roomcall.zip" . -x '__pycache__/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Signed build provenance for every release file
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Attach the signed provenance to the release
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/roomcall.intoto.jsonl
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    # Requires a PyPI "trusted publisher" for this repo + the `pypi` environment.
    # Enable by setting the repository variable PUBLISH_PYPI=true.
    if: vars.PUBLISH_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Keep only Python packages
        run: rm -f dist/roomcall.zip
      - uses: pypa/gh-action-pypi-publish@release/v1
