name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened and what did you expect? }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: RoomCall version, placeholder: "roomcall --version" }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Logs from `roomcall serve -v`, render: text }
