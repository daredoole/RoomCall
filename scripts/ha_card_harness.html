<!doctype html>
<!--
  Renders custom:roomcall-card outside Home Assistant with a fake `hass` object, so the docs
  screenshots show the real card without a live instance. Used by scripts/ha_screenshots.py.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomCall card harness</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  :root {
    --primary-color: #03a9f4; --text-primary-color: #fff; --error-color: #db4437;
    --success-color: #43a047; --ha-card-border-radius: 12px;
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
  }
  :root[data-scheme="dark"] {
    --primary-background-color: #111111; --card-background-color: #1c1c1c;
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: #2f2f2f;
    --app-header-background-color: #101e24;
  }
  :root[data-scheme="light"] {
    --primary-background-color: #fafafa; --card-background-color: #fff;
    --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: #e0e0e0;
    --app-header-background-color: #03a9f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--primary-background-color); color: var(--primary-text-color); }
  header {
    height: 56px; display: flex; align-items: center; gap: 24px; padding: 0 16px;
    background: var(--app-header-background-color); color: #fff; font-size: 20px;
  }
  header .mdi { font-size: 24px; }
  header .tabs { display: flex; gap: 22px; font-size: 14px; text-transform: uppercase; opacity: 0.85; }
  header .tabs b { border-bottom: 2px solid #fff; padding-bottom: 14px; margin-bottom: -16px; }
  main { padding: 16px; display: grid; gap: 16px; }
  main.desktop { grid-template-columns: 1fr 1.25fr 1fr; max-width: 1180px; margin: 0 auto; align-items: start; }
  .tile {
    background: var(--card-background-color); border: 1px solid var(--divider-color);
    border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px;
  }
  .tile .mdi { font-size: 22px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .tile small { display: block; color: var(--secondary-text-color); font-size: 13px; }
  .col { display: grid; gap: 12px; }
  .heading { font-size: 15px; font-weight: 500; color: var(--secondary-text-color); margin: 4px 2px -4px; }
</style>
</head>
<body>
<header>
  <span class="mdi mdi-menu"></span>
  <span class="title">Home</span>
  <span class="tabs"></span>
</header>
<main></main>
<script src="roomcall-card.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  document.documentElement.dataset.scheme = params.get("scheme") || "dark";
  const desktop = params.get("layout") === "desktop";

  // Minimal stand-ins for Home Assistant's own elements.
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML = `<style>:host{display:block;
        background:var(--card-background-color);border:1px solid var(--divider-color);
        border-radius:var(--ha-card-border-radius);color:var(--primary-text-color)}</style><slot></slot>`;
    }
  });
  customElements.define("ha-icon", class extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    connectedCallback() { this._draw(); }
    attributeChangedCallback() { this._draw(); }
    _draw() {
      const root = this.shadowRoot || this.attachShadow({ mode: "open" });
      const name = (this.getAttribute("icon") || "").replace("mdi:", "");
      root.innerHTML = `<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
        <style>:host{display:inline-flex}i{font-size:var(--mdc-icon-size,24px);line-height:1}</style>
        <i class="mdi mdi-${name}"></i>`;
    }
  });

  const ROOMS = [
    { area_id: "basement", name: "Basement", icon: "mdi:stairs-down", speakers: ["Basement"] },
    { area_id: "office", name: "Office", icon: "mdi:desk", speakers: ["Office"] },
    { area_id: "garage", name: "Garage", icon: "mdi:garage", speakers: ["Garage AirPlay"] },
    { area_id: "kitchen", name: "Kitchen", icon: "mdi:silverware-fork-knife", speakers: ["Kitchen Hub"] },
    { area_id: "living_room", name: "Living Room", icon: "mdi:sofa", speakers: ["Living Room"] },
  ];
  const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
  const HISTORY = [
    { id: "a1", at: ago(2), from: "kitchen", target: "basement", kind: "talk", priority: "normal", ok: true,
      text: "Dinner's ready, come on up", has_audio: true },
    { id: "a2", at: ago(25), from: "office", target: "all", kind: "talk", priority: "urgent", ok: true,
      text: "Who left the garage open?", has_audio: true },
    { id: "a3", at: ago(70), from: null, target: "living_room", kind: "message", priority: "normal", ok: true,
      text: "Laundry is done", has_audio: false },
  ];
  const states = { "switch.roomcall_do_not_disturb": { state: params.get("dnd") === "on" ? "on" : "off" } };
  if (params.get("doorbell") === "on") {
    states["binary_sensor.front_door_visitor"] = { state: "off", last_changed: ago(30), attributes: {} };
    states["camera.front_door"] = { state: "idle", attributes: { entity_picture: "/logo.svg" } };
  }
  const tasks = [{ id: "laundry", name: "Laundry", task: "Took out the dry clothes",
    state: params.get("tasks") === "open" ? "open" : "idle", opened: ago(12), done: null, done_by: null,
    remind_every: 15, entity_id: "sensor.laundry_task" }];
  const requests = [];
  const jobs = new Map();
  const tests = new Map();
  const stations = new Map();
  const sessions = new Map();
  const setupPlans = new Map(JSON.parse(sessionStorage.getItem("roomcall-plans")||"[]"));
  let setupSettings=JSON.parse(sessionStorage.getItem("roomcall-settings")||"null")||{
    speakers:ROOMS.map(r=>`media_player.${r.area_id}`),tts_engine:"tts.piper",volume:0.4};
  const setupHeard=new Set(JSON.parse(sessionStorage.getItem("roomcall-heard")||"[]"));
  const saveSetup=()=>{
    sessionStorage.setItem("roomcall-plans",JSON.stringify([...setupPlans]));
    sessionStorage.setItem("roomcall-settings",JSON.stringify(setupSettings));
    sessionStorage.setItem("roomcall-heard",JSON.stringify([...setupHeard]));
  };
  const hass = {
    states,
    language: "en",
    async callApi(method, path, body) {
      if (path.startsWith("roomcall/locale")) return (await (await fetch("/strings.json")).json()).selector.communication.options;
      if (path === "roomcall/command") {
        requests.push(body);
        const request = body.request || {};
        if(body.operation==="doctor")return {ok:true,findings:[],alternatives:[]};
        if(body.operation==="tasks") {
          const task=tasks.find(t=>t.id===request.id);
          if(request.action==="complete") {
            if(task?.state!=="open")return {ok:false,error:{code:"task_not_open",message:"Nothing to confirm"}};
            Object.assign(task,{state:"done",done:new Date().toISOString(),done_by:"Alex",opened:null});
          }
          return {ok:true,tasks};
        }
        if(body.operation==="setup") {
          const plan=setupPlans.get(request.id);
          if(request.action==="discover")return {ok:true,discovery:{
            configured:true,settings:setupSettings,recommended:setupSettings,
            endpoints:ROOMS.map(r=>({entity_id:`media_player.${r.area_id}`,name:r.name,eligible:true,
              selected:setupSettings.speakers.includes(`media_player.${r.area_id}`),available:true})),
            tts_engines:[{entity_id:"tts.piper",name:"Piper"}],questions:[]}};
          if(request.action==="list")return {ok:true,plans:[...setupPlans.values()]};
          if(request.action==="plan") {
            const id=crypto.randomUUID();
            const draft={id,revision:id,state:"draft",created:Date.now()/1000,
              settings:{...setupSettings,...request.settings},questions:[],tests:{},before:setupSettings};
            setupPlans.set(id,draft);saveSetup();return {ok:true,plan:draft};
          }
          if(request.action==="apply") {plan.state="applied";setupSettings=plan.settings;setupHeard.clear();saveSetup();return {ok:true,plan};}
          if(request.action==="undo") {
            if(!request.confirm)return {ok:false,error:{message:"Explicitly confirm this undo or deletion."}};
            plan.state="rolled_back";setupSettings=plan.before;saveSetup();return {ok:true,plan};
          }
          if(request.action==="test") {
            const id=crypto.randomUUID();plan.tests[request.speaker]=id;
            jobs.set(id,{ok:true,id,state:"completed",responses:[],speaker:request.speaker});saveSetup();
            return {ok:true,id,plan};
          }
          if(request.action==="confirm") {if(request.heard)setupHeard.add(request.speaker);else setupHeard.delete(request.speaker);saveSetup();return {ok:true,plan};}
          if(request.action==="verify")return {ok:true,plan,verification:{configuration_ready:true,
            completed:plan.settings.speakers.every(id=>setupHeard.has(id)),audio_confirmed:plan.settings.speakers.every(id=>setupHeard.has(id))}};
          return {ok:true,plan};
        }
        if (body.operation === "discover") return { ok:true, schema_version:1,
          profiles:[{id:"dinner",name:"Dinner",message:"Dinner is ready"}],
          endpoints:ROOMS.map((r) => ({ entity_id:`media_player.${r.area_id}`,name:r.name,selected:true,
            sound_test:tests.get(`media_player.${r.area_id}`) })),
          areas:ROOMS.map((r) => ({id:r.area_id,name:r.name})),
          satellites:[{entity_id:"assist_satellite.kitchen",name:"Kitchen Voice",available:true,can_ask:true}],
          stations:[...stations.values()].map((s) => ({id:s.id,name:s.name,room:s.room})),
          features:{voicemail:params.get("voicemail")==="on"} };
        if (body.operation === "preview" && request.profile && !request.areas && !request.people) return {ok:true,endpoints:["media_player.kitchen"]};
        if (body.operation === "preview") return {ok:true,endpoints:ROOMS.filter((r) => request.areas?.includes("all") || request.areas?.includes(r.area_id)).map((r) => `media_player.${r.area_id}`)};
        if (["send","ask","sound_test"].includes(body.operation)) {
          const id=crypto.randomUUID();
          const job={ok:true,id,progress:[{stage:"queued",elapsed_ms:0},{stage:"synthesizing",elapsed_ms:40},{stage:"completed",elapsed_ms:250}],result:{evidence:{"media_player.kitchen_announcement_endpoint_with_a_long_name_for_small_displays":{audio_fetched_ms:100,playback_reported_ms:200}},failed:{}},state:body.operation==="ask"?"answered":"completed",responses:body.operation==="ask"?[{sentence:"Pizza"}]:[]};
          jobs.set(id,{...job,speaker:request.speaker});
          return job;
        }
        if (body.operation === "status") return jobs.get(request.id);
        if (body.operation === "confirm_test") {tests.set(jobs.get(request.id).speaker,{heard:request.heard});return {ok:true,heard:request.heard};}
        if (body.operation === "voicemail") return {ok:true,messages:params.get("voicemail")==="on"?[
          {id:"v1",message:"Can someone grab the packages from the porch?"},
          {id:"v2",message:"Dinner moved to 7, see you then"}]:[]};
        return {ok:true};
      }
      if (path === "roomcall/history") return { calls: HISTORY };
      return {
        rooms: ROOMS, speakers: 5, dnd: false, dnd_entity: "switch.roomcall_do_not_disturb",
        doorbell: window.roomcallDoorbell !== undefined ? window.roomcallDoorbell : params.get("doorbell") === "on"
          ? { entity: "binary_sensor.front_door_visitor", camera: "camera.front_door", name: "Front Door" } : null,
        people: [{ entity_id: "person.alex", name: "Alex" }, { entity_id: "person.sam", name: "Sam" }],
      };
    },
    async callService() {},
    async callWS(msg) {
      const station=stations.get(msg.station_id);
      if (msg.action==="call") {
        const peer=stations.get(msg.peer),id=crypto.randomUUID();
        if (!peer) throw new Error("Station unavailable");
        sessions.set(id,{caller:station,callee:peer});
        peer.cb({type:"incoming",id,from:station.name,room:station.room});
        station.cb({type:"calling",id});
        return {id};
      }
      const session=sessions.get(msg.session_id);
      if (!session) throw new Error("Unknown session");
      const peer=session.caller===station?session.callee:session.caller;
      if (msg.action==="answer") peer.cb({type:"accepted",id:msg.session_id});
      if (msg.action==="signal") peer.cb({type:"signal",id:msg.session_id,signal:msg.signal});
      if (msg.action==="hangup") {sessions.delete(msg.session_id);for(const s of [session.caller,session.callee])s.cb({type:"ended",id:msg.session_id});}
      return {id:msg.session_id};
    },
    // Live calls: ready → delivered while talking → done after the end-of-audio frame.
    connection: {
      _cb: null,
      async subscribeMessage(cb, msg) {
        if(msg.type==="roomcall/station") {
          stations.set(msg.station_id,{id:msg.station_id,name:msg.name,room:msg.room,cb});
          return () => stations.delete(msg.station_id);
        }
        this._cb = cb;
        const hit = ROOMS.filter((r) => msg.target === "all" || r.area_id === msg.target);
        setTimeout(() => cb({ type: "ready", handler_id: 1 }), 50);
        setTimeout(() => cb({
          type: "delivered", ok: true, skipped: {},
          results: hit.flatMap((r) => r.speakers.map((s) => ({ speaker: s, ok: true }))),
        }), 700);
        return () => {};
      },
      socket: {
        send(frame) {
          if (frame.length === 1) setTimeout(() => hass.connection._cb({ type: "done", seconds: 3.2 }), 400);
        },
      },
    },
    async fetchWithAuth(url, options) {
      if (url === "/api/roomcall/shortcut") {
        const body = JSON.parse(options.body); requests.push({operation:"shortcut",request:body});
        if (body.format === "signed" && body.signing_key === "bad") return new Response(JSON.stringify({error:{message:"Signing failed"}}),{status:400});
        return new Response(body.format === "signed" ? "AEA1test" : `# RoomCall ${body.room}\nconst entered = prompt("What should I announce?")`,
          {headers:{"Content-Disposition":`attachment; filename*=UTF-8''RoomCall%20${body.room}.${body.format === "cherri" ? "cherri" : "shortcut"}`}});
      }
      await new Promise((r) => setTimeout(r, 400));
      const target = new URL(url, location.href).searchParams.get("target");
      const hit = ROOMS.filter((r) => target === "all" || r.area_id === target);
      return new Response(JSON.stringify({
        target, ok: true, seconds: 3.2, skipped: {},
        results: hit.flatMap((r) => r.speakers.map((s) => ({ speaker: s, ok: true }))),
      }), { headers: { "Content-Type": "application/json" } });
    },
  };
  window.ROOMCALL_HARNESS={hass,requests,stations,sessions,tasks};

  const tile = (icon, color, name, state) =>
    `<div class="tile"><span class="mdi mdi-${icon}" style="color:${color};background:color-mix(in srgb, ${color} 18%, transparent)"></span>
     <div>${name}<small>${state}</small></div></div>`;

  const main = document.querySelector("main");
  const card = document.createElement("roomcall-card");
  // No ?card= leaves `layout` unset, as in a card saved before the simple layout existed.
  const layout = params.get("card");
  hass.themes = { darkMode: document.documentElement.dataset.scheme === "dark" };
  const look = {};
  if (params.get("appearance")) look.appearance = params.get("appearance");
  if (params.get("color")) look.color = `#${params.get("color")}`;
  if (layout) look.layout = layout;
  card.setConfig({ title: "Intercom", default_room: "kitchen", room: "kitchen", ...look });
  card.hass = hass;
  if (desktop) {
    document.querySelector(".tabs").innerHTML = "<b>Home</b><span>Rooms</span><span>Media</span><span>Energy</span>";
    main.className = "desktop";
    main.innerHTML = `
      <div class="col"><div class="heading">Media</div>
        ${tile("speaker", "#ab47bc", "Basement", "Playing · Lo-fi beats")}
        ${tile("speaker", "#ab47bc", "Office", "Idle")}
        ${tile("cast", "#ab47bc", "Kitchen Hub", "Idle")}</div>
      <div class="col center"></div>
      <div class="col"><div class="heading">House</div>
        ${tile("garage", "#4caf50", "Garage door", "Closed")}
        ${tile("thermometer", "#ff9800", "Living room", "71 °F · 44 %")}
        ${tile("lightbulb-group", "#ffc107", "Lights", "3 on")}</div>`;
    main.querySelector(".center").append(card);
  } else if (layout === "kiosk") {
    document.querySelector("header").style.display = "none";
    main.style.height = "100vh";
    main.append(card);
  } else {
    main.append(card);
    if (layout === "compact") {
      main.insertAdjacentHTML("beforeend",
        tile("lightbulb-group", "#ffc107", "Lights", "3 on") + tile("garage", "#4caf50", "Garage door", "Closed"));
    }
  }
  if(params.get("stations")==="2") {
    const second=document.createElement("roomcall-card");
    second.setConfig({title:"Basement",room:"basement",default_room:"basement"});
    second.hass=hass;
    main.append(second);
  }
</script>
</body>
</html>
